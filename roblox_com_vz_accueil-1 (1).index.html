<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox.vz</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: linear-gradient(135deg, #111827, #2563eb);
}

header {
  padding: 20px;
  font-size: 28px;
  font-weight: bold;
}

.hero {
  padding: 80px 20px;
}

h1 {
  font-size: 50px;
}

p {
  font-size: 20px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 15px 25px;
  margin: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.play {
  background: #22c55e;
  color: white;
}

.shop {
  background: #facc15;
}

.rank {
  background: white;
}

.coin {
  width: 55px;
  height: 60px;
  margin: 20px auto;
  background: #facc15;
  color: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  clip-path: polygon(
    25% 0, 75% 0,
    100% 50%, 75% 100%,
    25% 100%, 0 50%
  );
  font-weight: bold;
}

footer {
  padding: 30px;
}
</style>
</head>

<body>

<header>
  🎮 Roblox.vz
</header>

<div class="hero">

  <h1>Bienvenue sur Roblox.vz 😍</h1>

  <p>Le jeu conçu pour le fun !</p>

  <div class="coin">VZ</div>

  <p>Monnaie : <b>1 000</b></p>

  <button class="play" onclick="alert('🎮 Le jeu arrive bientôt !')">
    ▶ Jouer
  </button>

  <button class="shop" onclick="alert('🛒 La boutique arrive bientôt !')">
    🛒 Boutique
  </button>

  <button class="rank" onclick="alert('🏆 Le classement arrive bientôt !')">
    🏆 Classement
  </button>

</div>

<footer>
  © 2026 Roblox.vz ❤️
</footer>

</body>
</html>
